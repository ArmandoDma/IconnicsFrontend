<section class="dashboard_header">
  <h2>Dashboard</h2>
  <p>
    Welcome back! Here's an overview of your health metrics and recent activity.
  </p>
</section>
<section class="metrics_section">
  <div class="metric_card">
    <h3>Average Heart Rate</h3>
    <p id="hr">0 bpm</p>
  </div>
  <div class="metric_card">
    <h3>Average Blood Oxygen</h3>
    <p id="oxygen">0%</p>
  </div>
  <div class="metric_card">
    <h3>Average Hydratation</h3>
    <p id="hydration">0%</p>
  </div>
  <div class="metric_card">
    <h3>Average Lose Calories</h3>
    <p id="calories">0 kcal</p>
  </div>
  <div class="chart_section">
    <div class="chart_block">
      <div class="chart_header">
        <h3>Project Analytics</h3>
      </div>
      <canvas id="projectChart"></canvas>
    </div>
  </div>
  <div class="tips">
    <h3>Health Tips</h3>
    <ul id="tips_list" class="tips_list"></ul>
  </div>
  <div class="notify">
    <h3>Last Notifications</h3>
    <ul id="notify_list" class="notify_list"></ul>
    <a href="#notifications">See More</a>
  </div>
</section>
